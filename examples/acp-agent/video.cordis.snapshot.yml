# Keyless counterpart to video.cordis.yml: only the model adapter is replaced
# by replay; the real service, provider, Consumer, filesystem, and subprocess
# composition still boots and handles the scripted calls.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: video-ffmpeg
            name: '@deepseek-ai/dsh-video-ffmpeg'
          - id: tool-video
            name: '@deepseek-ai/dsh-tool-video'
            config:
              enableRunInBackground: false
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
            config:
              providers:
                - id: deepseek-official
                  name: DeepSeek
                  models:
                    - id: deepseek-v4-flash
                    - id: deepseek-v4-pro
